# Render Blueprint: New + > Blueprint > pick this repo. Free plan, Docker runtime.
services:
  - type: web
    name: wayfarer-trip-planner
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Leave unset for the zero-key demo (mock model). Set in the Render dashboard for a real LLM.
      - key: LLM_PROVIDER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
